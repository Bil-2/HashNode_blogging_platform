[build]
  # --production=false on the client install ensures Vite (a devDep) is always installed
  # even when NODE_ENV=production. Without it, vite: command not found.
  command = "npm install && npm install --prefix server && npm install --prefix client --production=false && npm run build --prefix client"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]
  # 26s timeout — gives Atlas free-tier enough time to wake up on cold start.
  # Default Netlify timeout is 10s which is NOT enough for Atlas cold starts.
  timeout = 26

[build.environment]
  NODE_VERSION = "20"

# Redirect rules for API routes -> Netlify Functions
# NOTE: No :splat in the target — this preserves event.path as the original
# request path (/api/auth/login), which Express routes can match correctly.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Redirect rules for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
